[project]
name = "book-translate"
version = "0.3.0"
description = "Translate scanned books into a bilingual PDF and a PDF with the translation laid out on the original pages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.scripts]
book-translate = "book_translate.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["book_translate"]

[tool.pytest.ini_options]
markers = [
    "contract: пункт контракта из SPEC.md, например @pytest.mark.contract('BT-3')",
]

[tool.ruff]
line-length = 100
