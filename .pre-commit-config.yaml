repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: '(^|/)uv\.lock$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: strip-notebook-outputs
        name: Strip Jupyter notebook outputs
        entry: python hooks/strip_notebook_outputs.py
        language: system
        types: [jupyter]

  # Secrets never go to git: .env, credentials, private keys.
  - repo: local
    hooks:
      - id: no-env-files
        name: no secret files
        entry: bash -c 'echo "Refusing to commit a secrets file — $@"; exit 1' --
        language: system
        files: '(^|/)(\.env($|\.)|[^/]*creds[^/]*$|[^/]*credentials[^/]*$|id_rsa|\.netrc$|[^/]*cookies[^/]*$)'
        exclude: '\.env\.(example|sample|template)$'

  # Code carries no comments: names and docstrings explain it. Tool pragmas (noqa, type:, fmt:) are allowed.
  - repo: local
    hooks:
      - id: no-comments
        name: no comments in code
        entry: python hooks/no_comments.py
        language: system
        types: [python]
